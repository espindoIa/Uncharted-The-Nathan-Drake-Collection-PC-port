# Builds the runtime with MSYS2 CLANG64 and packages Uncharted-windows (launcher, Python, runtime and
# DLLs; no game files). The package is the workflow artifact "Uncharted-windows". A pushed tag
# vX.Y.Z (tools/release.sh) also publishes it as that release, with tools/release-notes/vX.Y.Z.md.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release of a tag

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Sources, patches and submodules keep the LF endings they are committed with (git apply);
      # long paths: the checkout folder repeats the repository's long name and FidelityFX's shader
      # files then pass Windows' 260-character limit.
      - name: Git settings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Windows Python that the package carries (Tkinter and Pillow for the launcher).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Pillow
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANG64
          update: true
          install: git patch curl
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p

      - name: Build the runtime
        run: |
          git config --global --add safe.directory '*'
          export MSYS2_ROOT=$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')
          gow3_pc/build.sh

      # NVIDIA DLAA (DLSS SDK files, the bridge built with the runner's MSVC) and the FSR 4 native
      # model; without them the package simply offers TAA and FSR 3.1.
      - name: Anti-aliasing files (DLAA, FSR 4)
        continue-on-error: true
        run: |
          export MSYS2_ROOT=$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')
          tools/fetch_aa_files.sh

      - name: Package
        run: |
          export MSYS2_ROOT=$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')
          export PYTHON_HOME=$(cygpath -u "$pythonLocation")
          tools/package_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Uncharted-windows
          path: dist/Uncharted-windows/
          if-no-files-found: error

      # The tag must match tools/VERSION (the package's VERSION, which the launcher's updates
      # compare); 0.x versions are called betas in the title but published as full releases (a
      # pre-release is never "Latest", so the repository page would not show it). GitHub records
      # the zip's SHA-256, which the launcher checks before installing it.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content tools/VERSION -Raw).Trim()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match tools/VERSION ($version)" }
          $notes = "tools/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes" }
          $title = "Uncharted: The Nathan Drake Collection PC port $version"
          if ($version.StartsWith("0.")) { $title += " (beta)" }
          gh release create $env:TAG dist/Uncharted-windows.zip --verify-tag --title $title `
            --notes-file $notes --latest

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gow3_pc/out/gpu-build.log
          if-no-files-found: ignore
